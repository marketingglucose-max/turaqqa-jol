 if(active?.id!==e.pointerId)return;const c=active.c,p=point(e);if(atPark(p,c)){finishPath(c);return}
 active=null;const tapped=distance(c.home,p)<40&&c.path.length<5;c.path=[c.home];selectedCar=tapped?c:null;
 $('#msg').textContent=tapped?'P'+(cars.indexOf(c)+1)+' тұрағын түрт немесе көліктен жол сыз.':'Жолды көліктен өз түсіндегі тұраққа дейін сыз.';controls();draw()
};
board.onpointercancel=()=>{if(steering!==null)helper.path.length=1;steering=null;controls();if(active){active.c.path=[active.c.home];active=null;selectedCar=null;controls();draw()}};
function lose(reason,car,target,kind){
 engineOff();sound('crash');mode='lost';$('#msg').textContent=reason+' Жолды қайта жоспарлап көр.';
 const len=distance(car,target),nx=len?(target.x-car.x)/len:Math.sin(car.angle),ny=len?(target.y-car.y)/len:-Math.cos(car.angle);
 const vx=car.vx||0,vy=car.vy||0,other=kind==='car',ox=other?(target.vx||0):0,oy=other?(target.vy||0):0;
 const mass=car.dozer?3:1,otherMass=other?(target.dozer?3:1):kind==='box'?.35:Infinity;
 const impulse=1.37*Math.max(0,(vx-ox)*nx+(vy-oy)*ny)/(1/mass+1/otherMass);
 const spin=(vx*ny-vy*nx)*.025;
 const bodies=[{car,vx:vx-impulse*nx/mass,vy:vy-impulse*ny/mass,spin}];
 if(other)bodies.push({car:target,vx:ox+impulse*nx/otherMass,vy:oy+impulse*ny/otherMass,spin:-spin});
 const wood=kind==='box';if(wood)boxes=boxes.filter(b=>b!==target);
 const pieces=Array.from({length:wood?16:11},(_,i)=>{
 const angle=Math.random()*2*Math.PI,r=20+Math.random()*64;
 return {x:wood?target.x:car.x+nx*13,y:wood?target.y:car.y+ny*13,z:5+Math.random()*8,
 vx:nx*impulse*(wood?1.9:.25)+Math.cos(angle)*r,vy:ny*impulse*(wood?1.9:.25)+Math.sin(angle)*r,
 vz:55+Math.random()*105,angle,spin:(Math.random()-.5)*13,w:wood?5+Math.random()*9:3+Math.random()*5,h:wood?3.5:2.5,color:(wood?['#97613b','#d49a63','#f3c68a']:['#879499','#d6e7e6',tints[cars.indexOf(car)]])[i%3]}});
 impact={bodies,pieces,time:0}
}
function drift(o,v,dt,pad){
 o.x+=v.vx*dt;o.y+=v.vy*dt;
 if(o.x<pad||o.x>400-pad){o.x=Math.max(pad,Math.min(400-pad,o.x));v.vx*=-.32}
 if(o.y<pad||o.y>480-pad){o.y=Math.max(pad,Math.min(480-pad,o.y));v.vy*=-.32}
}
function settle(dt){
 impact.time+=dt;
 for(const b of impact.bodies){drift(b.car,b,dt,26);b.car.angle+=b.spin*dt;const drag=Math.exp(-4*dt);b.vx*=drag;b.vy*=drag;b.spin*=drag}
 for(const p of impact.pieces){drift(p,p,dt,5);p.z+=p.vz*dt;p.vz-=380*dt;if(p.z<=0){p.z=0;p.vz=Math.abs(p.vz)*.30;if(p.vz<8)p.vz=0;const drag=Math.exp(-12*dt);p.vx*=drag;p.vy*=drag;p.spin*=drag}p.angle+=p.spin*dt}
}
function drawDebris(){if(!impact)return;for(const p of impact.pieces){const ground=project(p.x,p.y),air=project(p.x,p.y,p.z);ctx.fillStyle='#17242a55';ctx.fillRect(ground.x-p.w*ground.k/2,ground.y,p.w*ground.k,2);ctx.save();ctx.translate(air.x,air.y);ctx.scale(air.k,air.k);ctx.rotate(p.angle);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}}
function advance(dt){if(traffic&&!traffic.off){traffic.x+=traffic.dir*.15*dt;if(traffic.x< -35||traffic.x>435)traffic.off=true}for(let g of gates){if(g.state==='up'&&(g.timer-=dt)<=0){g.state='down';g.trigger=null}}
 for(let c of cars){const prevX=c.x,prevY=c.y;const moving=c.step<c.path.length;let left=dt*.115;while(left>0&&c.step<c.path.length){let p=c.path[c.step],d=distance(c,p);if(d>.01)c.angle=Math.atan2(p.y-c.y,p.x-c.x)+Math.PI/2;if(left>=d){c.x=p.x;c.y=p.y;c.step++;left-=d}else{c.x+=(p.x-c.x)*left/d;c.y+=(p.y-c.y)*left/d;break}}c.vx=dt?(c.x-prevX)*1000/dt:0;c.vy=dt?(c.y-prevY)*1000/dt:0;if(moving&&c.step===c.path.length){burst('park',c,tints[cars.indexOf(c)]);sound('park')}}
 for(let c of cars){if(inIsland(c,14)){lose('Көлік жол жиегіне соғылды.',c,island,'gate');return}if(traffic&&!traffic.off&&Math.abs(traffic.x-c.x)<41&&Math.abs(traffic.y-c.y)<29){lose('Қара көлікпен соқтығыстың.',c,traffic,'gate');return}if(helper&&!helper.off&&distance(helper,c)<34){lose('Көлік бульдозерге соғылды.',c,helper,'gate');return}for(let g of gates){let inside=Math.abs(c.x-g.x)<30&&Math.abs(c.y-g.y)<14;if(inside&&g.state==='up'){lose('Көлік көтерілген тосқауылға соғылды.',c,g,'gate');return}if(inside&&!g.trigger)g.trigger=c;if(!inside&&g.state==='down'&&g.trigger===c){g.state='up';g.timer=1350}}
 for(let b of boxes){let d=distance(b,c);if(d<24){if(!c.dozer){lose('Көлік жәшікке соғылды.',c,b,'box');return}let nx=(b.x-c.x)/(d||1),ny=(b.y-c.y)/(d||1),p={x:c.x+nx*24.1,y:c.y+ny*24.1};if(p.x<15||p.x>385||p.y<18||p.y>462||boxes.some(o=>o!==b&&distance(o,p)<27)||gates.some(g=>g.state==='up'&&Math.abs(g.x-p.x)<29&&Math.abs(g.y-p.y)<15)){lose('Жәшікті әрі қарай итеруге орын жоқ.',c,b,'box');return}Object.assign(b,p)}}
 for(let p of coins)if(!p.hit&&distance(c,p)<27){p.hit=true;earned++;burst('coin',p);sound('coin')}}
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
 const a=cars[i],b=cars[j];if(distance(a,b)>76)continue;
 const ends=c=>[-20,0,20].map(d=>({x:c.x+d*Math.sin(c.angle),y:c.y-d*Math.cos(c.angle)}));
 if(ends(a).some(p=>ends(b).some(q=>distance(p,q)<29))){lose('Көліктер соқтығысты.',a,b,'car');return}}
 if(cars.every(c=>c.step===c.path.length)){mode='won';engineOff();burst('win');sound('win');save.money+=earned;if(!save.done.includes(index))save.done.push(index);persist();$('#msg').textContent='Барлық көлік тұраққа жетті! Әмияныңа '+earned+' тиын қосылды.'}}
function tick(t){let dt=Math.min(40,t-last);last=t;while(dt>0&&mode==='run'){let s=Math.min(8,dt);advance(s);dt-=s}if(impact)settle(dt/1000);draw();controls();if(mode==='run'||(impact&&impact.time<2.5))frame=requestAnimationFrame(tick)}
$('#reset').onclick=start;$('#go').onclick=()=>{if(mode==='won'){if(index+1>unlockedThrough()||index===layouts.length-1){tab('map');return}index++;start()}else if(mode==='lost')start();else if(mode==='draw'&&cars.every(c=>c.ready)){wake();engineOn();mode='run';last=performance.now();$('#msg').textContent='Көліктер жолға шықты…';controls();frame=requestAnimationFrame(tick)}};persist();start();tab('play');
// Home screen app: offline copy plus an install button.
(()=>{
 const button=$('#install'),guide=$('#guide'),ua=navigator.userAgent;
 const installed=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),android=/Android/.test(ua);
 const embedded=/Instagram|FBAN|FBAV|TikTok|musical_ly|BytedanceWebview|Telegram|; wv\)/i.test(ua);
 let offer=null;
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(installed){navigator.storage?.persist?.().catch(()=>{});return}
 button.hidden=!(ios||android);
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();offer=e;button.hidden=false});
 addEventListener('appinstalled',()=>{offer=null;button.hidden=true;if(guide.open)guide.close()});
 function steps(){
  if(embedded)return ['Мәзірді (⋯ немесе ⋮) бас',ios?'«Safari-де ашу» дегенді таңда':'«Браузерде ашу» / «Chrome-да ашу» дегенді таңда','Ашылған бетте «📲 Орнату» батырмасын қайта бас'];
  if(ios)return ['Браузердің «Бөлісу» батырмасын (⬆️) бас','«На экран Домой» / «Add to Home Screen» дегенді таңда','«Добавить» / «Add» дегенді бас'];
  return ['Chrome мәзірін (⋮) бас','«Установить приложение» / «Добавить на главный экран» дегенді таңда','«Установить» дегенді бас']
 }
 button.onclick=async()=>{
  if(offer){const e=offer;offer=null;e.prompt();await e.userChoice.catch(()=>{});return}
  $('#guide ol').replaceChildren(...steps().map(t=>{const li=document.createElement('li');li.textContent=t;return li}));
  guide.showModal()
 };
 $('#guide button').onclick=()=>guide.close();
})();
